name: Vérification quotidienne des référentiels

on:
  schedule:
    # Tous les jours à 8h00 UTC (9h ou 10h heure française selon l'heure d'été)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Permet aussi de le déclencher manuellement depuis l'onglet Actions,
    # utile pour tester sans attendre le lendemain

jobs:
  check-frameworks:
    runs-on: ubuntu-latest
    steps:
      - name: Déclenche la vérification des référentiels
        env:
          # Secret du dépôt = même valeur que ADMIN_TOKEN côté serveur
          ADMIN_TOKEN: ${{ secrets.MCP_TRUST_ADMIN_TOKEN }}
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            https://mcp-trust-score.onrender.com/framework-check)
          echo "HTTP $status — réponse : $(cat response.json)"

          # Fait échouer le job si la requête a échoué (pas si simplement
          # aucun changement n'a été détecté)
          if [ "$status" != "200" ]; then
            echo "❌ Échec de la vérification (HTTP $status)"
            exit 1
          fi
